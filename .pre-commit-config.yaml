default_language_version:
  python: python3

default_stages: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-ast
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: debug-statements
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: black-check
        name: black --check
        entry: black --check
        language: system
        types: [python]

      - id: ruff-check
        name: ruff check
        entry: ruff check
        language: system
        types: [python]

      - id: ruff-format-check
        name: ruff format --check
        entry: ruff format --check
        language: system
        types: [python]

      - id: mypy
        name: mypy type check
        entry: mypy
        language: system
        pass_filenames: false
        args: [sigmastorm/config.py, training/data.py, scripts/build_corpus.py]
        types: [python]

      - id: bandit
        name: bandit security check
        entry: bandit -r sigmastorm training scripts tests -c pyproject.toml
        language: system
        pass_filenames: false
        types: [python]

      - id: pytest
        name: pytest full suite
        entry: python -m pytest tests -q
        language: system
        pass_filenames: false
        types: [python]
