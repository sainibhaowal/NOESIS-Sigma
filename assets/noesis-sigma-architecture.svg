<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">NOESIS-Σ executable architecture</title>
  <desc id="desc">A bounded-state recurrent sequence model: tokens enter a normalized operator bank, pass through independent gates and a bounded transition, then return to the residual stream while fixed-size state is carried between chunks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="0.56" stop-color="#111a33"/>
      <stop offset="1" stop-color="#21183d"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#65f6ff"/>
      <stop offset="1" stop-color="#6d9cff"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9b7cff"/>
      <stop offset="1" stop-color="#ef78d5"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd58f"/>
      <stop offset="1" stop-color="#f4a86d"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6cf5ff"/>
    </marker>
    <marker id="state-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#bd8cff"/>
    </marker>
  </defs>

  <rect x="10" y="10" width="1380" height="740" rx="34" fill="url(#bg)" stroke="#5befff" stroke-opacity="0.78" stroke-width="2"/>
  <rect x="26" y="26" width="1348" height="708" rx="24" fill="none" stroke="#a77bff" stroke-opacity="0.25"/>

  <text x="52" y="70" fill="#6cf5ff" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="700" letter-spacing="4">NOESIS-Σ · EXECUTABLE ARCHITECTURE</text>
  <text x="52" y="108" fill="#f4f7ff" font-family="Inter,Segoe UI,sans-serif" font-size="28" font-weight="700">A bounded transition with a fixed-size memory contract</text>
  <text x="52" y="136" fill="#aab8d5" font-family="Inter,Segoe UI,sans-serif" font-size="16">The residual stream stays additive; recurrent state is carried explicitly between chunks.</text>

  <g font-family="Inter,Segoe UI,sans-serif">
    <rect x="52" y="188" width="174" height="96" rx="18" fill="#15233d" stroke="#5befff" stroke-opacity="0.65"/>
    <text x="72" y="222" fill="#6cf5ff" font-size="13" font-weight="700" letter-spacing="2">INPUT STREAM</text>
    <text x="72" y="254" fill="#f4f7ff" font-size="22" font-weight="700">x₁ … xₜ</text>
    <text x="72" y="274" fill="#93a4c5" font-size="13">tokens / residual</text>

    <rect x="264" y="188" width="164" height="96" rx="18" fill="#15233d" stroke="#6d9cff" stroke-opacity="0.75"/>
    <text x="284" y="222" fill="#a4bdff" font-size="13" font-weight="700" letter-spacing="2">NORMALIZE</text>
    <text x="284" y="255" fill="#f4f7ff" font-size="21" font-weight="700">u = RMSNorm(x)</text>
    <text x="284" y="275" fill="#93a4c5" font-size="13">clean operator stream</text>

    <path d="M226 236 H254" stroke="#6cf5ff" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M428 236 H454" stroke="#6cf5ff" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="454" y="158" width="404" height="156" rx="22" fill="#101a31" stroke="#7a8fff" stroke-opacity="0.7"/>
    <text x="478" y="188" fill="#d9e3ff" font-size="13" font-weight="700" letter-spacing="2">OPERATOR BANK · ALL LINEAR IN T FOR FIXED STATE</text>

    <rect x="476" y="204" width="178" height="48" rx="12" fill="#142a3b" stroke="#5befff" stroke-opacity="0.55"/>
    <text x="490" y="225" fill="#6cf5ff" font-size="14" font-weight="700">SHORT CONV</text>
    <text x="490" y="242" fill="#9db0d3" font-size="12">local order · k−1 tail</text>

    <rect x="670" y="204" width="168" height="48" rx="12" fill="#1c193c" stroke="#b78cff" stroke-opacity="0.7"/>
    <text x="684" y="225" fill="#d7b9ff" font-size="14" font-weight="700">DELTA RULE</text>
    <text x="684" y="242" fill="#b2a7d7" font-size="12">key → value recall</text>

    <rect x="476" y="260" width="178" height="42" rx="12" fill="#18253b" stroke="#ffd58f" stroke-opacity="0.62"/>
    <text x="490" y="279" fill="#ffd58f" font-size="14" font-weight="700">SLOT MEMORY</text>
    <text x="490" y="294" fill="#b5b5c9" font-size="12">bounded prototypes</text>

    <rect x="670" y="260" width="168" height="42" rx="12" fill="#1e1b3d" stroke="#ef78d5" stroke-opacity="0.62"/>
    <text x="684" y="279" fill="#ef9be0" font-size="14" font-weight="700">SUMMARY RING</text>
    <text x="684" y="294" fill="#b5a8cc" font-size="12">pooled global path</text>

    <rect x="882" y="188" width="152" height="96" rx="18" fill="#14253a" stroke="#65f6ff" stroke-opacity="0.72"/>
    <text x="902" y="220" fill="#6cf5ff" font-size="13" font-weight="700" letter-spacing="1.5">CONTROLLER</text>
    <text x="902" y="249" fill="#f4f7ff" font-size="17" font-weight="700">σ gates</text>
    <text x="902" y="270" fill="#a9b5d1" font-size="12">normalized mixture</text>
    <path d="M858 236 H872" stroke="#6cf5ff" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M1034 236 H1052" stroke="#6cf5ff" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="1052" y="188" width="166" height="96" rx="18" fill="#211a3e" stroke="#c18cff" stroke-opacity="0.76"/>
    <text x="1072" y="220" fill="#d7b9ff" font-size="13" font-weight="700" letter-spacing="1.5">BOUNDED STEP</text>
    <text x="1072" y="249" fill="#f4f7ff" font-size="17" font-weight="700">−∇E + Project</text>
    <text x="1072" y="270" fill="#b7a9d2" font-size="12">‖v‖ ≤ R</text>
    <path d="M1218 236 H1234" stroke="#6cf5ff" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="1234" y="188" width="112" height="96" rx="18" fill="#17243a" stroke="#ffd58f" stroke-opacity="0.68"/>
    <text x="1252" y="220" fill="#ffd58f" font-size="13" font-weight="700" letter-spacing="1.5">OUTPUT</text>
    <text x="1252" y="250" fill="#f4f7ff" font-size="19" font-weight="700">x′</text>
    <text x="1252" y="271" fill="#a9b5d1" font-size="12">x + out(v)</text>
  </g>

  <path d="M1290 302 C1290 360 1190 378 1110 378 H290 C200 378 138 344 138 302" fill="none" stroke="#6cf5ff" stroke-opacity="0.5" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="555" y="365" fill="#8ea3c9" font-family="Inter,Segoe UI,sans-serif" font-size="14" text-anchor="middle">additive residual stream · depth acts as transition time</text>

  <rect x="52" y="438" width="1294" height="210" rx="24" fill="#0e172c" stroke="#a77bff" stroke-opacity="0.42"/>
  <text x="78" y="475" fill="#d7b9ff" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="700" letter-spacing="2">CARRIED STATE · FIXED SHAPE AT CONSTRUCTION TIME</text>
  <text x="78" y="501" fill="#9eafd0" font-family="Inter,Segoe UI,sans-serif" font-size="14">State persists across calls; it does not grow with the number of tokens already seen.</text>

  <g font-family="Inter,Segoe UI,sans-serif">
    <rect x="78" y="530" width="220" height="78" rx="16" fill="#14283b" stroke="#5befff" stroke-opacity="0.58"/>
    <text x="98" y="559" fill="#6cf5ff" font-size="14" font-weight="700">CONV TAIL</text>
    <text x="98" y="583" fill="#b5c2dc" font-size="13">k−1 recent inputs</text>

    <rect x="322" y="530" width="220" height="78" rx="16" fill="#1d1939" stroke="#b78cff" stroke-opacity="0.65"/>
    <text x="342" y="559" fill="#d7b9ff" font-size="14" font-weight="700">SSM MATRICES</text>
    <text x="342" y="583" fill="#c0b3dc" font-size="13">H × state_expand states</text>

    <rect x="566" y="530" width="220" height="78" rx="16" fill="#292039" stroke="#ffd58f" stroke-opacity="0.62"/>
    <text x="586" y="559" fill="#ffd58f" font-size="14" font-weight="700">SLOT MEMORY</text>
    <text x="586" y="583" fill="#d4c2bf" font-size="13">keys · values · accumulators</text>

    <rect x="810" y="530" width="220" height="78" rx="16" fill="#211d3d" stroke="#ef78d5" stroke-opacity="0.62"/>
    <text x="830" y="559" fill="#ef9be0" font-size="14" font-weight="700">SUMMARY RING</text>
    <text x="830" y="583" fill="#c9b6d6" font-size="13">fixed pooled-chunk slots</text>

    <rect x="1054" y="530" width="246" height="78" rx="16" fill="#17253a" stroke="#7fa6ff" stroke-opacity="0.62"/>
    <text x="1074" y="559" fill="#a9c3ff" font-size="14" font-weight="700">WINDOW KV + PREV</text>
    <text x="1074" y="583" fill="#b5c2dc" font-size="13">optional local ring · token carry</text>
  </g>

  <path d="M700 438 V405 C700 388 742 380 796 380" fill="none" stroke="#bd8cff" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#state-arrow)"/>
  <text x="824" y="414" fill="#bd8cff" font-family="Inter,Segoe UI,sans-serif" font-size="13">state returned to the next chunk</text>

  <text x="52" y="700" fill="#6cf5ff" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="700" letter-spacing="2">RESEARCH PROTOTYPE · MECHANISM-LEVEL EVIDENCE, NOT FRONTIER-PARITY CLAIMS</text>
  <text x="1346" y="700" fill="#8295bb" font-family="Inter,Segoe UI,sans-serif" font-size="13" text-anchor="end">NOESIS-Σ / SIGMASTORM</text>
</svg>
