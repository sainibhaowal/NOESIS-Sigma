[project]
name = "noesis_sigma"
version = "0.1.0a1"
description = "NOESIS-Σ - Verifiable Realtime Cognitive Engine"
authors = [{ name = "Ravinder Singh", email = "251900306+sainibhaowal@users.noreply.github.com" }]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.11"

[project.urls]
Homepage = "https://github.com/sainibhaowal/NOESIS-Sigma"
Repository = "https://github.com/sainibhaowal/NOESIS-Sigma.git"
Issues = "https://github.com/sainibhaowal/NOESIS-Sigma/issues"
Discussions = "https://github.com/sainibhaowal/NOESIS-Sigma/discussions"
dependencies = [
    "torch>=2.4.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "python-multipart>=0.0.22",
    "sqlmodel>=0.0.22",
    "sqlalchemy>=2.0.30",
    "loguru>=0.7.2",
    "httpx>=0.27.0",
    "faiss-gpu-cu12>=1.8.0.2",
    "pot>=0.9.6",
    "pypdf>=5.0.0",
    "pgvector>=0.2.5",
]

[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["API*", "Core*", "External*", "Runtime*"]

[tool.setuptools.package-data]
Core = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E","F","W"]
ignore = ["E203","E266","E501"]

[tool.ruff.format]
quote-style = "preserve"

# —— mypy ——————————————————————————————————————————
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
no_implicit_optional = true
strict_optional = true
check_untyped_defs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
plugins = []
explicit_package_bases = true
mypy_path = ["typings"]

[tool.pytest.ini_options]
markers = [
  "fast: quick CPU sanity",
  "nightly: longer runs",
  "acceptance_suite: acceptance test suite runs",
  "integration: integration tests",
]

[tool.isort]
profile = "black"
